services:
  - type: web
    name: ai-rfp-system
    runtime: docker
    dockerfilePath: ./project-qwen-rfp/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: VLLM_URL
        sync: false
      # The 512MB free instance OOMs loading the local embedding model
      # (onnxruntime + bge-small); see rfpbench/document.py's _model().
      - key: DISABLE_EMBEDDINGS
        value: "1"
